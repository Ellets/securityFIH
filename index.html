<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIH Test Gateway</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
            text-align: center;
        }
        h2 { color: #38bdf8; margin-top: 0; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }
        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background: #0ea5e9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .status { margin-top: 1rem; font-size: 0.85rem; color: #fbbf24; min-height: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🧪 FIH Test Gateway</h2>
        <p>Click the button below to manually fire the telemetry event and test your Google Sheet connection.</p>
        <button id="testBtn" onclick="runTestAndRedirect()">Simulate Visit & Redirect</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        // Updated with your latest working deployment URL
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyMUYrw_dEpaERVT6oMMBeTxJlg7RJTwxQqFh5VIzv7x3gK1iVG--w4MbTU4Uhs24m3/exec";
        const TARGET_URL = "https://www.google.com";

        async function runTestAndRedirect() {
            const btn = document.getElementById('testBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.innerText = "Processing...";
            status.innerText = "Fetching IP & transmitting telemetry...";

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 600);
                
                let clientIp = "Unknown";
                try {
                    const ipRes = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
                    clearTimeout(timeoutId);
                    const ipData = await ipRes.json();
                    clientIp = ipData.ip || "Unknown";
                } catch (e) {
                    clientIp = "Unknown";
                }

                const telemetry = {
                    ip: clientIp,
                    platform: navigator.platform || "Unknown",
                    isAutomated: navigator.webdriver || false,
                    userAgent: navigator.userAgent || "Unknown"
                };

                const blob = new Blob([JSON.stringify(telemetry)], { type: 'application/json' });
                navigator.sendBeacon(WEB_APP_URL, blob);

                status.innerText = "Data sent successfully! Redirecting...";
            } catch (e) {
                status.innerText = "Transmission error, redirecting anyway...";
            }

            setTimeout(() => {
                window.location.replace(TARGET_URL);
            }, 1000);
        }
    </script>
</body>
</html>
