<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Telemetry</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            border: 1px solid #334155;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 1rem; color: #94a3b8; font-size: 1.25rem; }
        .metric {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0.5rem 0;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Device Telemetry</h2>
        <div class="metric" id="northVal">North (Heading): Waiting...</div>
        <div class="metric" id="verticalVal">Vertical (Tilt): Waiting...</div>
    </div>

    <script>
        window.addEventListener('deviceorientation', (event) => {
            // iOS provides webkitCompassHeading for true magnetic north
            let north = "Not Available";
            if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
                north = `${event.webkitCompassHeading.toFixed(1)}°`;
            } else if (event.alpha !== null) {
                // Fallback alpha orientation relative to initial load
                north = `${event.alpha.toFixed(1)}°`;
            }

            // Beta represents front-to-back tilt (vertical angle)
            let vertical = event.beta !== null ? `${event.beta.toFixed(1)}°` : "Not Available";

            document.getElementById('northVal').innerText = `North (Heading): ${north}`;
            document.getElementById('verticalVal').innerText = `Vertical (Tilt): ${vertical}`;
        }, true);
    </script>

</body>
</html>
