<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIH Admin Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 2rem;
            margin: 0;
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
        }
        .subtext {
            color: #94a3b8;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            align-items: center;
        }
        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        button:hover {
            background: #0ea5e9;
        }
        .live-indicator {
            font-size: 0.85rem;
            color: #34d399;
            font-weight: 500;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
            font-size: 0.85rem;
        }
        th {
            background: #0f172a;
            color: #38bdf8;
        }
        tr:hover {
            background: #252f45;
        }
        code {
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            color: #34d399;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>📊 FIH Live Traffic Dashboard</h1>
    <div class="subtext">Real-time gateway logs fetched securely from your Google Sheet backend.</div>
    
    <div class="controls">
        <button onclick="loadLogs()">🔄 Refresh Now</button>
        <span class="live-indicator">🟢 Auto-refreshing every 5 seconds</span>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>IP Address</th>
                <th>Location</th>
                <th>Platform</th>
                <th>Security Flag</th>
                <th>User Agent</th>
            </tr>
        </thead>
        <tbody id="logTableBody">
            <tr><td colspan="6" style="text-align: center; color: #94a3b8;">Loading traffic logs...</td></tr>
        </tbody>
    </table>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbypwMn_1VTtTUvTcJz9T6pOAPMr42LmMQ3Wftmg2qZNE8O_QLbrpLgHyiG_Kpl6iuzW/exec";

        async function loadLogs() {
            const tbody = document.getElementById('logTableBody');

            try {
                const response = await fetch(WEB_APP_URL);
                const logs = await response.json();

                if (!Array.isArray(logs) || logs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #94a3b8;">No traffic records found in sheet yet.</td></tr>`;
                    return;
                }

                tbody.innerHTML = logs.map(log => `
                    <tr>
                        <td>${new Date(log.timestamp).toLocaleString()}</td>
                        <td><code>${log.ip || 'Unknown'}</code></td>
                        <td>${log.location || 'Unknown'}</td>
                        <td>${log.platform}</td>
                        <td>${log.status}</td>
                        <td><small style="color: #94a3b8;">${log.userAgent}</small></td>
                    </tr>
                `).join('');
            } catch (e) {
                // Keep previous table data if a background fetch glitch occurs so the screen doesn't flicker red
                console.error("Failed to auto-refresh logs", e);
            }
        }

        // Load instantly on page open
        window.onload = () => {
            loadLogs();
            // Automatically poll the sheet every 5 seconds
            setInterval(loadLogs, 5000);
        };
    </script>
</body>
</html>
